[project]
name = "freshdesk-connector"
version = "0.1.0"
description = "Read-only Freshdesk connector (MCP server) for Agent Studio agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp>=1.10",
]

[project.scripts]
freshdesk-connector = "freshdesk_connector.cli:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
